<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Invoice Maker</title>
<!-- Lemon Squeezy Overlay Script -->
<script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e7f0;--ac:#5b5bf0;--ac2:#8b5cf6;--ok:#0f9d6b;--bad:#e8590c;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);--st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--cd:#151b2e;--tx:#eef1f8;--mu:#94a3b8;--bd:#242c44;--ac:#8b8cff;--ac2:#a78bfa;--ok:#4ade9f;--bad:#ff9a62;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--cd:#151b2e;--tx:#eef1f8;--mu:#94a3b8;--bd:#242c44;--ac:#8b8cff;--ac2:#a78bfa;--ok:#4ade9f;--bad:#ff9a62;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:0 16px 150px;min-height:100vh}
.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--st)) 0 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.top h1{flex:1;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}.tr{display:flex;gap:8px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pg{animation:f .22s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.sl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin:20px 4px 8px}
label{display:block;margin:12px 0 5px;font-size:12px;font-weight:600;color:var(--mu)}.card>label:first-child,.r label{margin-top:0}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;max-width:100%;outline:0;transition:border .15s,box-shadow .15s,transform .1s}
input,select,textarea{width:100%}textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
button{cursor:pointer;font-weight:650;background:var(--cd);display:inline-flex;align-items:center;justify-content:center;gap:8px}button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:14px 22px;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent)}
button.sec{border-color:var(--bd)}button.w{width:100%}button.d{color:var(--bad);border-color:transparent;background:transparent;box-shadow:none}button.sm{padding:6px 10px;font-size:13px}
button.x{border:0;background:transparent;color:var(--mu);padding:0 6px;font-size:18px}
.ib{width:42px;height:42px;border-radius:50%;padding:0;box-shadow:var(--sh);flex:none}.ib .tap{font-size:11px;padding:0 8px}.ib:has(.tap){width:auto;border-radius:21px}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.r>*{flex:1 1 90px;min-width:0}.r>button{flex:0 0 auto}
.mu{color:var(--mu);font-size:13px}.hint{margin:6px 0 0 30px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.ck{display:flex!important;gap:10px;align-items:center;margin:4px 0!important;font-size:14px!important;color:var(--tx)!important;font-weight:500!important}.ck input{width:20px;height:20px;padding:0;flex:none;accent-color:var(--ac)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:24px;padding:20px;margin:6px 0 16px;box-shadow:0 14px 30px color-mix(in srgb,var(--ac) 32%,transparent)}
.hero span,.hero small{display:block;opacity:.85;font-size:13px}.hero b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.inv{display:flex;align-items:center;gap:12px;cursor:pointer}.inv .gr{flex:1;min-width:0}.inv .gr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inv .amt{text-align:right;font-weight:800;font-size:16px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);flex:none}
.it{border-top:1px solid var(--bd);padding:12px 0 6px;margin-top:6px}.it:first-child{border:0;padding-top:0;margin:0}.am{padding:13px 0;font-weight:800}
.tot{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:24px;padding:18px 20px;margin:0 0 14px;box-shadow:0 14px 30px color-mix(in srgb,var(--ac) 30%,transparent)}
.tot .tl,.tot .tl2{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.85}.tot .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tot .rs{border-top:1px solid rgba(255,255,255,.25);margin-top:12px;padding-top:10px}.tr2{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px;opacity:.95}.tr2.b{font-weight:800;font-size:16px;opacity:1}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 12px}.empty .big{width:56px;height:56px;color:var(--ac)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:clamp(8px,8vw,56px);background:var(--cd);border-top:1px solid var(--bd);padding:8px 0 calc(8px + var(--sb))}
.nav button{border:0;background:transparent;color:var(--mu);flex-direction:column;gap:2px;font-size:11px;padding:4px 20px;box-shadow:none}.nav button.on{color:var(--ac)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + var(--sb));z-index:6;border-radius:99px;padding:14px 20px}
.act{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:640px;margin:0 auto;display:flex;gap:10px;padding:12px 16px calc(12px + var(--sb));background:var(--cd);border-top:1px solid var(--bd)}
.wel{padding-top:calc(40px + var(--st))}.wel h1{font-size:32px;margin:14px 0 6px}.lead{font-size:15px;margin:0 0 18px}.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 12px 26px color-mix(in srgb,var(--ac) 35%,transparent)}.logo .i{width:30px;height:30px}
.pbamt{margin-left:auto;color:var(--mu);font-weight:600;transition:color .15s}.pbamt.on{color:var(--ac);font-weight:800}.ck span{flex:1}
.pb2{padding:5px 14px;border-radius:99px;font-size:13px;margin-top:4px;background:transparent}.pb2.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent)}.pb2.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.av.ok{color:#fff;background:var(--ok)}.av .i{width:20px;height:20px;stroke-width:3}.fl{display:flex;gap:8px;margin:0 0 14px}.fl button{padding:7px 16px;border-radius:99px;font-size:13px}.fl button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dl{color:var(--bad);background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);margin-top:6px}.tot{position:relative}.tot .pd{position:absolute;right:16px;top:14px;background:rgba(255,255,255,.25);padding:2px 12px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.06em}
.lg{cursor:pointer;margin:0!important;padding:13px 16px;border:1.5px solid var(--bd);border-radius:14px;text-align:center;font-size:15px!important;font-weight:650!important;color:var(--tx)!important;background:var(--cd);flex:0 0 auto!important}
.lrow{display:flex;gap:12px;align-items:flex-end}.lbox{width:76px;height:76px;flex:0 0 auto;margin:0!important;border:1.5px dashed var(--bd);border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;background:var(--bg);color:var(--mu)!important;font-size:11px!important;text-align:center;overflow:hidden;padding:0}.lbox img{width:100%;height:100%;object-fit:contain;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:9;animation:f .2s}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const r2=n=>Math.round(Number((n*100).toPrecision(15)))/100;
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
let S={biz:{name:'',addr:'',email:'',phone:'',taxId:'',cur:'USD'},taxes:[],clients:[],invoices:[],seq:1},V={v:'list'};
try{const j=localStorage.getItem('inv1');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}
const save=()=>{try{localStorage.setItem('inv1',JSON.stringify(S))}catch(e){}};
const applyTheme=()=>{document.documentElement.setAttribute('data-theme',S.theme==='light'||S.theme==='dark'?S.theme:'')};applyTheme();
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.biz.cur||'USD'}).format(n)}catch(e){return (+n).toFixed(2)}};

/*CALC*/
function calc(inv,taxes){let sub=0;const tt={},fd=id=>taxes.find(t=>t.id===id)||(inv.snap||[]).find(t=>t.id===id),its=inv.items.map(it=>{const base=r2((+it.q||0)*(+it.p||0)),d=it.dt==='%'?base*(+it.disc||0)/100:(+it.disc||0);return[r2(Math.max(0,base-d)),it.tx]}),
tot=its.reduce((a,x)=>a+x[0],0),D=inv.dt==='$'?(+inv.disc||0):tot*(+inv.disc||0)/100,k=tot>0?Math.max(0,tot-D)/tot:1;
for(const [n0,tx] of its){const net=n0*k,rs=(inv.tax||tx||[]).map(fd).filter(Boolean),sum=rs.reduce((a,t)=>a+(+t.rate||0),0),ex=inv.incl?net/(1+sum/100):net;sub+=ex;for(const t of rs)tt[t.name]=(tt[t.name]||0)+ex*(+t.rate||0)/100}
sub=r2(sub);const lines=Object.entries(tt).map(([n,v])=>[n,r2(v)]),tax=r2(lines.reduce((a,l)=>a+l[1],0)),total=r2(sub+tax),
wh=inv.wh&&+inv.wh.rate?r2(sub*inv.wh.rate/100):0,pay=r2(total-wh),paid=r2((inv.pays||[]).reduce((a,p)=>a+(+p.amt||0),0));
return{sub,lines,total,wh,pay,paid,bal:r2(pay-paid),gross:r2(tot),disc:r2(tot-tot*k)}}
/*END*/

const trows=(c,i)=>[...(c.disc>0?[['Items total',c.gross],['Discount',-c.disc],...(c.lines.length||i.incl?[['Subtotal before tax',c.sub]]:[])]:[['Subtotal',c.sub]]),...c.lines,...(c.wh?[['Withholding ('+((i.wh&&i.wh.name)||'tax')+')',-c.wh]]:[])];
const cname=id=>(S.clients.find(c=>c.id===id)||{}).name||'No client';
const plist=inv=>{const k=S.invoices.findIndex(x=>x.id==inv.id);return (k<0?S.invoices:S.invoices.slice(0,k)).filter(x=>inv.cid&&x.cid==inv.cid).map(x=>[x,calc(x,S.taxes).bal]).filter(a=>a[1]>0)};
const fmtNo=n=>'INV-'+String(n).padStart(4,'0');
const maxNo=()=>S.invoices.reduce((m,i)=>{const d=String(i.no).match(/(\d+)\s*$/);return d?Math.max(m,+d[1]):m},0);
const sd=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}catch(e){return d}};
let FL='all';
const prev=inv=>r2(plist(inv).reduce((a,p)=>a+p[1],0));
const pAmt=inv=>inv.pbOn?(plist(inv).length?prev(inv):r2(+inv.pbAmt||0)):0;
const CUR=['USD','EUR','GBP','PKR','INR','AED','SAR','CAD','AUD','NZD','CHF','SEK','NOK','DKK','JPY','CNY','SGD','MYR','ZAR','NGN','KES','EGP','TRY','BRL','MXN'];
const ic={back:'<path d="M15 5l-7 7 7 7"/>',doc:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',users:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12l5 5 9-10"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/>',dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const svg=(d,c)=>`<svg class="${c||'i'}" viewBox="0 0 24 24">${d}</svg>`;
const hdr=(t,b,r)=>`<div class="top">${b?`<button class="ib" aria-label="Back" onclick="${b}">${svg(ic.back)}</button>`:''}<h1>${t}</h1><div class="tr">${r||''}</div></div>`;
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function go(v,x){if(v=='edit'&&x&&x.tax===undefined)x.tax=[...new Set(x.items.flatMap(it=>it.tx||[]))];V={v,inv:x};render();window.scrollTo(0,0)}
function nav(){const t=(v,l,d)=>`<button class="${V.v==v?'on':''}" onclick="go('${v}')">${svg(d)}<span>${l}</span></button>`;return `<nav class="nav">${t('list','Invoices',ic.doc)}${t('cl','Clients',ic.users)}${t('set','Settings',ic.set)}</nav>`}
function render(){const a=$('#app');if(!S.ob&&!S.biz.name&&!S.invoices.length){a.innerHTML=wel();return}
a.innerHTML=(V.v=='edit'?edit():V.v=='cl'?clients():V.v=='set'?settings():list())+(V.v=='edit'?'':nav())}
function wel(){return `<div class="pg wel"><div class="logo">${svg(ic.doc)}</div><h1>Welcome</h1><p class="mu lead">Create professional invoices in seconds. Works offline, and your data stays on this phone.</p><div class="card"><label>Your business name</label><input id="wn" placeholder="e.g. Ali Plumbing"><label>Currency</label><select id="wc">${CUR.map(c=>`<option ${c==S.biz.cur?'selected':''}>${c}</option>`).join('')}</select><label>Do you charge tax on your invoices?</label><select id="wt" onchange="$('#wx').style.display=this.value=='1'?'flex':'none'"><option value="0">No tax (you can add one later)</option><option value="1">Yes, I charge tax</option></select><div class="r" id="wx" style="display:none;margin-top:12px"><div><label>Tax name</label><input id="wtn" placeholder="VAT, GST…"></div><div><label>Rate %</label><input id="wtr" type="number" inputmode="decimal" step="any" placeholder="e.g. 10"></div></div></div><button class="p w" onclick="wgo()">Start</button><div class="mu" style="text-align:center;margin-top:12px">You can change all of this later in Settings.</div></div>`}
function wgo(){S.biz.name=$('#wn').value.trim();S.biz.cur=$('#wc').value;if($('#wt').value=='1'){const n=$('#wtn').value.trim(),r=+$('#wtr').value;if(n&&r>=0)S.taxes.push({id:uid(),name:n,rate:r,def:true})}S.ob=1;save();go('list')}
function newInv(){go('edit',{id:uid(),no:fmtNo(S.seq),date:today(),due:'',cid:S.clients.length==1?S.clients[0].id:'',items:[{d:'',q:1,p:0,disc:0,dt:'%',tx:[]}],tax:S.taxes.filter(t=>t.def).map(t=>t.id),disc:0,dt:'%',pbOn:false,pbAmt:0,pays:[],notes:'',isNew:true})}
function openInv(id){go('edit',JSON.parse(JSON.stringify(S.invoices.find(x=>x.id==id))))}
function setPaid(id,flag){const i=S.invoices.find(x=>x.id==id);if(!i)return;const c=calc(i,S.taxes);if(flag){if(c.bal>0)(i.pays=i.pays||[]).push({date:today(),amt:c.bal,auto:1})}else{const k=(i.pays||[]).filter(p=>!p.auto);i.pays=calc({...i,pays:k},S.taxes).bal<=0?[]:k}save();render()}
function setF(f){FL=f;render()}
function list(){const all=S.invoices.map(i=>[i,calc(i,S.taxes)]),out=r2(all.reduce((a,x)=>a+Math.max(0,x[1].bal),0)),nu=all.filter(x=>x[1].bal>0).length,pdn=all.filter(x=>x[1].pay>0&&x[1].bal<=0).length;
let h=hdr('Invoices',null,themeBtn())+`<div class="pg"><div class="hero"><span>Outstanding</span><b>${money(out)}</b><small>${nu} unpaid · ${pdn} paid</small></div>`;
if(!S.invoices.length)h+=`<div class="empty">${svg(ic.doc,'i big')}<b>No invoices yet</b><span class="mu">Create your first invoice in under a minute.</span><button class="p" onclick="newInv()">Create invoice</button></div>`;
else h+=`<div class="fl">${[['all','All'],['unpaid','Unpaid'],['paid','Paid']].map(f=>`<button class="${FL==f[0]?'on':''}" onclick="setF('${f[0]}')">${f[1]}</button>`).join('')}</div>`;
let shown=0;for(const [i,c] of [...all].reverse()){const paid=c.pay>0&&c.bal<=0;if(FL=='unpaid'&&paid||FL=='paid'&&!paid)continue;shown++;const n=cname(i.cid);
h+=`<div class="card inv" onclick="openInv('${i.id}')"><div class="av ${paid?'ok':''}">${paid?svg(ic.check):esc(n.trim().charAt(0).toUpperCase()||'?')}</div><div class="gr"><b>${esc(n)}</b><div class="mu">${esc(i.no)} · ${esc(sd(i.date))} · <span style="color:var(--${paid?'ok':'bad'});font-weight:700">${c.pay<=0?'No items':paid?'Paid':'Unpaid'}</span></div></div><div class="amt">${money(c.pay)}<div>${c.pay>0?`<button class="pb2 ${paid?'bad':'ok'}" onclick="event.stopPropagation();setPaid('${i.id}',${!paid})">${paid?'Unpaid':'Paid'}</button>`:''}</div></div></div>`}
if(S.invoices.length&&!shown)h+=`<div class="mu" style="text-align:center;margin:24px">Nothing here.</div>`;
return h+`</div>`+(S.invoices.length?`<button class="p fab" onclick="newInv()">${svg(ic.plus)}New invoice</button>`:'')}
const item=(it,n)=>`<div class="it"><input placeholder="Description" value="${esc(it.d)}" onchange="V.inv.items[${n}].d=this.value"><div class="r" style="margin-top:8px"><div><label>Qty</label><input type="number" inputmode="decimal" step="any" onfocus="if(+this.value===0)this.value=''" value="${it.q}" onchange="setIt(${n},'q',this.value)"></div><div><label>Price</label><input type="number" inputmode="decimal" step="any" onfocus="if(+this.value===0)this.value=''" value="${it.p}" onchange="setIt(${n},'p',this.value)"></div><div><label>Amount</label><div class="am" id="am${n}">${money(r2((+it.q||0)*(+it.p||0)))}</div></div></div>${V.inv.items.length>1?`<button class="d sm" onclick="rmIt(${n})">Remove item</button>`:''}</div>`;
const adj=i=>S.taxes.length?`<div class="card"><label>Tax on this invoice</label>${S.taxes.map(t=>`<label class="ck"><input type="checkbox" ${(i.tax||[]).includes(t.id)?'checked':''} onchange="tg('${t.id}')">${esc(t.name)} ${t.rate}%</label>`).join('')}</div>`:'';
const totHTML=i=>{const c=calc(i,S.taxes),pa=pAmt(i),pl=plist(i),show=c.lines.length||c.disc>0||c.wh,rows=trows(c,i).map(r=>`<div class="tr2"><span>${esc(r[0])}</span><span>${r[1]<0?'−':''}${money(Math.abs(r[1]))}</span></div>`).join('');
let h=`<div class="tot">${c.pay>0&&c.bal<=0?'<span class="pd">PAID</span>':''}<div class="tl">TOTAL</div><div class="big">${money(c.pay)}</div>${show?`<div class="rs">${rows}</div>`:''}`;
if(c.paid>0&&c.bal>0)h+=`<div class="rs"><div class="tr2"><span>Paid</span><span>−${money(c.paid)}</span></div><div class="tr2 b"><span>Balance on this invoice</span><span>${money(c.bal)}</span></div></div>`;
